name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build Star Command.app
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}" ./build.sh
      - name: Package
        run: |
          ditto -c -k --keepParent "build/Star Command.app" StarCommand.zip
          shasum -a 256 StarCommand.zip > StarCommand.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" StarCommand.zip StarCommand.zip.sha256 --title "Star Command ${GITHUB_REF_NAME}" --generate-notes
